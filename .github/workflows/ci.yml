name: Tests and dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen ruff check src install tests
      - run: uv run --frozen ruff format --check src install tests
      - run: uv run --frozen python -m compileall -q src install
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python install/bootstrap.py --doctor

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt > /dev/null
      - run: uvx pip-audit==2.10.1 --disable-pip --no-deps -r audit-requirements.txt
