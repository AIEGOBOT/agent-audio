[project]
name = "agent-audio"
version = "0.1.0"
description = "Universal local audio generation MCP and Agent Skill for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.30,<2",
  "psutil>=6,<8",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
agent-audio = "agent_audio.cli:main"
agent-audio-mcp = "agent_audio.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_audio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
