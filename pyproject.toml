[project]
name = "agent-audio"
version = "0.1.0"
description = "Universal local audio generation MCP and Agent Skill for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.12,<2",
]

[project.scripts]
agent-audio = "agent_audio.cli:main"
agent-audio-mcp = "agent_audio.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_audio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
